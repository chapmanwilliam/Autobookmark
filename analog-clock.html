<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analog Clock</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: sans-serif;
  }
  .clock {
    width: 400px;
    height: 400px;
    border-radius: 50%;
    border: 6px solid #222;
    position: relative;
    background: #fff;
    box-shadow: 0 0 20px rgba(0,0,0,0.15);
  }
  .center-dot {
    width: 14px;
    height: 14px;
    background: #222;
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
  }
  .hand {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform-origin: bottom center;
    border-radius: 4px;
  }
  .hour-hand {
    width: 6px;
    height: 100px;
    background: #222;
    margin-left: -3px;
    z-index: 3;
  }
  .minute-hand {
    width: 4px;
    height: 140px;
    background: #444;
    margin-left: -2px;
    z-index: 4;
  }
  .second-hand {
    width: 2px;
    height: 155px;
    background: #e74c3c;
    margin-left: -1px;
    z-index: 5;
  }
  .marker {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
  }
  .marker span {
    position: absolute;
    display: block;
    background: #333;
    left: 50%;
    transform-origin: center bottom;
  }
  .number {
    position: absolute;
    font-size: 28px;
    font-weight: bold;
    color: #222;
    text-align: center;
    width: 40px;
    height: 40px;
    line-height: 40px;
  }
</style>
</head>
<body>
<div class="clock" id="clock">
  <div class="center-dot"></div>
  <div class="hand hour-hand" id="hour"></div>
  <div class="hand minute-hand" id="minute"></div>
  <div class="hand second-hand" id="second"></div>
</div>
<script>
  const clock = document.getElementById('clock');
  const radius = 200;

  // Draw hour numbers
  for (let i = 1; i <= 12; i++) {
    const angle = (i * 30 - 90) * (Math.PI / 180);
    const x = radius + Math.cos(angle) * (radius - 40) - 20;
    const y = radius + Math.sin(angle) * (radius - 40) - 20;
    const num = document.createElement('div');
    num.className = 'number';
    num.textContent = i;
    num.style.left = x + 'px';
    num.style.top = y + 'px';
    clock.appendChild(num);
  }

  // Draw tick marks
  for (let i = 0; i < 60; i++) {
    const tick = document.createElement('span');
    const angle = i * 6;
    const isHour = i % 5 === 0;
    tick.style.width = isHour ? '3px' : '1px';
    tick.style.height = isHour ? '18px' : '10px';
    tick.style.top = '10px';
    tick.style.marginLeft = isHour ? '-1.5px' : '-0.5px';
    tick.style.transformOrigin = 'center ' + (radius - 10) + 'px';
    tick.style.transform = 'rotate(' + angle + 'deg)';
    tick.style.position = 'absolute';
    tick.style.left = '50%';
    tick.style.background = isHour ? '#222' : '#999';
    clock.appendChild(tick);
  }

  function updateClock() {
    const now = new Date();
    const h = now.getHours() % 12;
    const m = now.getMinutes();
    const s = now.getSeconds();
    const ms = now.getMilliseconds();

    const secondDeg = (s + ms / 1000) * 6;
    const minuteDeg = (m + s / 60) * 6;
    const hourDeg = (h + m / 60) * 30;

    document.getElementById('second').style.transform = 'rotate(' + secondDeg + 'deg)';
    document.getElementById('minute').style.transform = 'rotate(' + minuteDeg + 'deg)';
    document.getElementById('hour').style.transform = 'rotate(' + hourDeg + 'deg)';
  }

  updateClock();
  setInterval(updateClock, 1000);
</script>
</body>
</html>
